<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>BookNest</title>
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>BookNest</h1>
            <p class="tagline">My reading shelf</p>
        </header>

        <main>
            <section class="add-book">
                <h2 id="form-title">Add any book</h2> <!-- New: id so we can change the text when editing -->
                <form id="book-form">
                    <input type="text" id="title" placeholder="title" required>
                    <input type="text" id="author" placeholder="author" required>
                    <select id="genre">
                        <option value="">Genre</option>
                        <option>Sci-Fi</option>
                        <option>Mystery</option>
                        <option>Realistic</option>
                        <option>Dystopian</option>
                        <option>Action</option>
                        <option>Fantasy</option>
                        <option>Romance</option>
                        <option>Sport</option>
                        <option>Other</option>
                    </select>
                    <input type="number" id="rating" min="1" max="5" placeholder="Your rating (1-5)" required>
                    <textarea id="notes" placeholder="Quick notes / Review"></textarea>
                    <button type="submit" id="submit-btn">Add to shelf</button> <!--New: id so we can change the button text-->
                    <button type="button" id="cancel-edit" class="hidden">Cancel edits</button> <!--New: added a new cancel button to cancel any edits, and it is hidden by default-->
                </form>
            </section>

            <section class="shelf">
                <h2>Your shelf</h2>
                <div id="book-list"></div>
            </section>
        </main>
        
        <div id="detail-modal" class="modal hidden">
            <div class="modal-content">
                <button id="close-modal">close</button>
                <h3 id="detail-title"></h3>
                <p id="detail-author"></p>
                <p id="detail-genre"></p>
                <p id="detail-rating"></p>
                <p id="detail-notes"></p>
                <button id="edit-book">Edit this book</button> <!--New: edit button-->
                <button id="delete-book">Delete this book</button>
            </div>
        </div>

        <footer>
        <p>Made by Nebulous • October 2026</p>
        </footer>

        <script src="script.js"></script>
    </body>
</html>
