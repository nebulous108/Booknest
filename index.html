<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="login-open-btn" class="login-open-btn">Log in</button>

    <div id="user-info" class="user-info hidden">
        <span id="user-email"></span>
        <button id="logout-btn">Log out</button>
    </div>

    <header>
        <h1>BookNest</h1>
        <p class="tagline">My reading shelf</p>
    </header>

    <main>
        <section class="add-book">
            <h2 id="form-title">Add any book</h2>
            <form id="book-form">
                <input type="text" id="title" placeholder="Title" required>
                <input type="text" id="author" placeholder="Author" required>
                <select id="genre">
                    <option value="">Genre</option>
                    <option>Sci-Fi</option>
                    <option>Mystery</option>
                    <option>Realistic</option>
                    <option>Dystopian</option>
                    <option>Action</option>
                    <option>Fantasy</option>
                    <option>Romance</option>
                    <option>Sport</option>
                    <option>Other</option>
                </select>
                <input type="number" id="rating" min="1" max="5" placeholder="Rating (1-5)">
                <input type="date" id="date-finished">

                <div class="tags-selector">
                    <p class="tags-label">Tags</p>
                    <label><input type="checkbox" name="tags" value="Favorites"> Favorites</label>
                    <label><input type="checkbox" name="tags" value="Want to Read"> Want to Read</label>
                    <label><input type="checkbox" name="tags" value="Currently Reading"> Currently Reading</label>
                    <label><input type="checkbox" name="tags" value="Finished"> Finished</label>
                    <label><input type="checkbox" name="tags" value="School"> School</label>
                    <label><input type="checkbox" name="tags" value="Reread"> Reread</label>
                </div>

                <textarea id="notes" placeholder="Quick notes / Review"></textarea>
                <button type="submit" id="submit-btn">Add to shelf</button>
                <button type="button" id="cancel-edit" class="hidden">Cancel edits</button>
            </form>
        </section>

        <div class="shelf-container">
            <section class="shelf-section">
                <h2>Want to Read</h2>
                <div id="want-list" class="book-grid"></div>
            </section>

            <section class="shelf-section">
                <h2>Currently Reading</h2>
                <div id="current-list" class="book-grid"></div>
            </section>

            <section class="shelf-section">
                <h2>Finished</h2>
                <div id="finished-list" class="book-grid"></div>
            </section>

            <section class="shelf-section">
                <h2>All Books</h2>
                <div class="search-area">
                    <input type="text" id="search-bar" placeholder="Search...">
                    <select id="search-filter">
                        <option value="all">All</option>
                        <option value="title">Title</option>
                        <option value="author">Author</option>
                        <option value="genre">Genre</option>
                    </select>
                </div>
                <div id="all-list" class="book-grid"></div>
            </section>
        </div>

        <section class="stats">
            <h2>Reading Stats</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="total-books">0</div>
                    <div class="stat-label">Total</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="books-this-year">0</div>
                    <div class="stat-label">This Year</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="avg-rating">-</div>
                    <div class="stat-label">Avg Rating</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="top-genre">-</div>
                    <div class="stat-label">Top Genre</div>
                </div>
            </div>

            <div class="goal-section">
                <h3>Yearly Goal</h3>
                <div class="goal-input">
                    <input type="number" id="goal-input" min="1" placeholder="Goal">
                    <button type="button" id="save-goal">Save</button>
                </div>
                <div class="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <p id="goal-text">No goal set</p>
            </div>
        </section>
    </main>

    <div id="detail-modal" class="modal hidden">
        <div class="modal-content">
            <button id="close-modal">Close</button>
            <h3 id="detail-title"></h3>
            <p id="detail-author"></p>
            <p id="detail-genre"></p>
            <p id="detail-rating"></p>
            <p id="detail-tags"></p>
            <p id="detail-notes"></p>
            <div class="modal-buttons">
                <button id="edit-book">Edit</button>
                <button id="delete-book">Delete</button>
            </div>
        </div>
    </div>

    <div id="login-overlay" class="login-overlay hidden">
        <div class="login-modal">
            <button id="login-close-btn" class="login-close">×</button>
            <h2>Log in / Sign up</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button type="button" id="login-btn">Log in</button>
            <button type="button" id="signup-btn">Sign up</button>
            <div class="divider">or</div>
            <button type="button" id="google-btn" class="provider-btn">Continue with Google</button>
            <button type="button" id="github-btn" class="provider-btn">Continue with GitHub</button>
        </div>
    </div>

    <footer>
        <p>Made by Nebulous • October 2026</p>
    </footer>

    <script src="script.js" type="module"></script>
</body>
</html>
