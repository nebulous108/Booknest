<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="login-open-btn" class="login-open-btn">Log in</button>

    <div id="user-info" class="user-info hidden">
        <span id="user-email"></span>
        <button id="logout-btn">Log out</button>
    </div>

    <header>
        <h1>BookNest</h1>
        <p class="tagline">My reading shelf</p>
    </header>

    <main>
        <section class="add-book">
            <h2 id="form-title">Add any book</h2>
            <form id="book-form">
                <input type="text" id="title" placeholder="Title" required>
                <input type="text" id="author" placeholder="Author" required>
                <select id="genre">
                    <option value="">Genre</option>
                    <option>Sci-Fi</option>
                    <option>Mystery</option>
                    <option>Realistic</option>
                    <option>Dystopian</option>
                    <option>Action</option>
                    <option>Fantasy</option>
                    <option>Romance</option>
                    <option>Sport</option>
                    <option>Other</option>
                </select>
                <input type="number" id="rating" min="1" max="5" placeholder="Rating (1-5)" required>

                <div class="tags-selector">
                    <p class="tags-label">Tags</p>
                    <label><input type="checkbox" name="tags" value="Favorites"> Favorites</label>
                    <label><input type="checkbox" name="tags" value="Reread"> Reread</label>
                    <label><input type="checkbox" name="tags" value="School"> School</label>
                    <label><input type="checkbox" name="tags" value="Finished"> Finished</label>
                    <label><input type="checkbox" name="tags" value="Currently Reading"> Currently Reading</label>
                </div>

                <textarea id="notes" placeholder="Quick notes / Review"></textarea>
                <button type="submit" id="submit-btn">Add to shelf</button>
                <button type="button" id="cancel-edit" class="hidden">Cancel edits</button>
            </form>
        </section>

        <section class="shelf">
            <h2>Your shelf</h2>

            <div class="search-area">
                <input type="text" id="search-bar" placeholder="Search your shelf...">
                <select id="search-filter">
                    <option value="all">All</option>
                    <option value="title">Title</option>
                    <option value="author">Author</option>
                    <option value="genre">Genre</option>
                    <option value="tags">Tags</option>
                </select>
            </div>

            <div id="book-list"></div>
            <p id="empty-message" class="empty hidden">No books match your search.</p>
        </section>
    </main>

    <div id="detail-modal" class="modal hidden">
        <div class="modal-content">
            <button id="close-modal">Close</button>
            <h3 id="detail-title"></h3>
            <p id="detail-author"></p>
            <p id="detail-genre"></p>
            <p id="detail-rating"></p>
            <p id="detail-tags"></p>
            <p id="detail-notes"></p>
            <div class="modal-buttons">
                <button id="edit-book">Edit this book</button>
                <button id="delete-book">Delete this book</button>
            </div>
        </div>
    </div>

    <!-- Login overlay -->
    <div id="login-overlay" class="login-overlay hidden">
        <div class="login-modal">
            <button id="login-close-btn" class="login-close">×</button>
            <h2>Log in / Sign up</h2>

            <input type="text" id="first-name" placeholder="First name">
            <input type="text" id="last-name" placeholder="Last name">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">

            <button type="button" id="login-btn">Log in</button>
            <button type="button" id="signup-btn">Sign up</button>

            <div class="divider">or</div>

            <button type="button" id="google-btn" class="provider-btn">Continue with Google</button>
            <button type="button" id="github-btn" class="provider-btn">Continue with GitHub</button>
        </div>
    </div>

    <footer>
        <p>Made by Nebulous • October 2026</p>
    </footer>

        import { getAuth } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

        const firebaseConfig = {

             storageBucket: "exolens-login.firebasestorage.app",
             messagingSenderId: "681324039728",

        window.auth = getAuth(app);
        window.db = getFirestore(app);
    </script>
    <script src="script.js" type="module"></script>
</body>
</html>
